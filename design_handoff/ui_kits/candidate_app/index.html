<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Vagas Guarujá · App</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; min-height: 100vh; background: linear-gradient(180deg, #F2F3EF 0%, #E5E8DF 100%); }
  body { font-family: var(--vg-font-body); color: var(--vg-fg-1); -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }

  .stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; gap: 32px; flex-wrap: wrap; }
  .device-label { text-align: center; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--vg-fg-3); margin-top: 14px; }
  .device-wrap { display: flex; flex-direction: column; align-items: center; }

  .vg-phone { font-family: var(--vg-font-body); color: var(--vg-fg-1); background: var(--vg-bg); height: 100%; display: flex; flex-direction: column; position: relative; }
  .vg-phone .scroll { flex: 1; overflow-y: auto; padding-bottom: 90px; }
  .vg-phone .topspace { height: 54px; flex-shrink: 0; }

  .ph-header { padding: 16px 20px 12px; background: var(--vg-bg); }
  .ph-header h1 { font-family: var(--vg-font-display); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .ph-header .sub { font-size: 13px; color: var(--vg-fg-3); margin-top: 2px; }
  .ph-search { display: flex; align-items: center; gap: 10px; background: white; border: 1px solid var(--vg-border); padding: 11px 14px; border-radius: 999px; margin-top: 14px; color: var(--vg-fg-3); box-shadow: var(--vg-shadow-xs); }
  .ph-search input { border: 0; outline: 0; flex: 1; font-size: 14px; color: var(--vg-fg-1); background: transparent; }
  .ph-chips { display: flex; gap: 8px; padding: 12px 20px 6px; overflow-x: auto; }
  .ph-chips::-webkit-scrollbar { display: none; }
  .ph-chip { font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--vg-border-strong); background: white; color: var(--vg-fg-2); white-space: nowrap; flex-shrink: 0; }
  .ph-chip.on { background: var(--vg-green-500); color: white; border-color: var(--vg-green-500); }

  .mjob { background: white; border: 1px solid var(--vg-border); border-radius: 14px; padding: 16px; margin: 10px 20px; box-shadow: var(--vg-shadow-sm); cursor: pointer; }
  .mjob .h { display: flex; gap: 12px; align-items: flex-start; }
  .mjob .logo { width: 42px; height: 42px; border-radius: 10px; background: var(--vg-green-50); color: var(--vg-green-700); display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: var(--vg-font-display); font-size: 15px; flex-shrink: 0; }
  .mjob .title { font-weight: 700; font-size: 15px; line-height: 1.3; margin: 2px 0 2px; }
  .mjob .company { font-size: 12px; color: var(--vg-fg-3); }
  .mjob .heart { margin-left: auto; color: var(--vg-fg-4); background: none; border: 0; padding: 0; }
  .mjob .heart.on { color: var(--vg-coral-500); }
  .mjob .meta { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 11px; color: var(--vg-fg-3); flex-wrap: wrap; }
  .mjob .meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--vg-fg-4); }
  .mjob .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .mjob .tag { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--vg-ink-100); color: var(--vg-fg-2); }
  .mjob .tag.coral { background: var(--vg-coral-50); color: var(--vg-coral-700); }
  .mjob .salary { font-family: var(--vg-font-display); font-weight: 700; font-size: 16px; color: var(--vg-green-700); margin-top: 10px; }

  .ph-back { position: absolute; top: 60px; left: 16px; z-index: 6; width: 36px; height: 36px; background: white; border-radius: 50%; border: 1px solid var(--vg-border); display: flex; align-items: center; justify-content: center; box-shadow: var(--vg-shadow-sm); padding: 0; }
  .ph-detail-hero { padding: 56px 20px 20px; background: white; border-bottom: 1px solid var(--vg-border); }
  .ph-detail-hero .badges { display: flex; gap: 6px; margin-bottom: 12px; }
  .ph-detail-hero .badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .ph-detail-hero .badge.coral { background: var(--vg-coral-50); color: var(--vg-coral-700); }
  .ph-detail-hero .badge.green { background: var(--vg-green-50); color: var(--vg-green-700); }
  .ph-detail-hero h2 { font-family: var(--vg-font-display); font-size: 22px; font-weight: 700; line-height: 1.2; margin: 0 0 10px; letter-spacing: -0.01em; }
  .ph-detail-hero .crow { display: flex; gap: 10px; align-items: center; }
  .ph-detail-hero .crow .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--vg-green-50); color: var(--vg-green-700); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
  .ph-detail-hero .crow .n { font-weight: 600; font-size: 13px; }
  .ph-detail-hero .crow .l { font-size: 12px; color: var(--vg-fg-3); }
  .ph-detail-hero .info { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
  .ph-detail-hero .info .lbl { font-size: 10px; font-weight: 600; color: var(--vg-fg-3); text-transform: uppercase; letter-spacing: 0.06em; }
  .ph-detail-hero .info .val { font-weight: 700; font-size: 14px; margin-top: 2px; }
  .ph-detail-hero .info .val.green { color: var(--vg-green-700); font-family: var(--vg-font-display); font-size: 16px; }

  .sect { padding: 18px 20px; background: white; margin-top: 8px; }
  .sect h3 { font-family: var(--vg-font-display); font-size: 16px; font-weight: 700; margin: 0 0 10px; }
  .sect p { font-size: 13px; line-height: 1.55; color: var(--vg-fg-2); margin: 0 0 6px; }
  .sect ul { margin: 0; padding-left: 16px; font-size: 13px; line-height: 1.6; color: var(--vg-fg-2); }

  .ph-cta-bar { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 20px 36px; background: rgba(255,255,255,0.94); backdrop-filter: blur(12px); border-top: 1px solid var(--vg-border); z-index: 10; }
  .ph-cta-bar button { width: 100%; padding: 14px; background: var(--vg-green-500); color: white; border: 0; border-radius: 14px; font-weight: 700; font-size: 16px; box-shadow: var(--vg-shadow-brand); }

  .ph-form { padding: 50px 20px 20px; }
  .ph-form h2 { font-family: var(--vg-font-display); font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
  .ph-form .sub { font-size: 13px; color: var(--vg-fg-3); margin-bottom: 18px; }
  .ph-field { margin-bottom: 12px; }
  .ph-field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--vg-fg-2); }
  .ph-field input, .ph-field select, .ph-field textarea { width: 100%; padding: 11px 14px; border: 1px solid var(--vg-border-strong); border-radius: 12px; background: white; font-size: 14px; font-family: inherit; color: var(--vg-fg-1); }
  .ph-field input:focus, .ph-field textarea:focus { outline: none; border-color: var(--vg-green-500); box-shadow: 0 0 0 4px rgba(0,168,107,0.12); }
  .lgpd-box { background: var(--vg-green-50); border: 1px solid #BCEAD2; padding: 14px 16px; border-radius: 12px; margin: 14px 0; font-size: 12px; color: var(--vg-green-800); line-height: 1.5; }
  .lgpd-box b { display:block; margin-bottom: 4px; font-size: 13px; }
  .consent { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
  .consent .cbox { width: 20px; height: 20px; border: 1.5px solid var(--vg-border-strong); border-radius: 5px; background: white; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
  .consent .cbox.on { background: var(--vg-green-500); border-color: var(--vg-green-500); }
  .consent .cbox.on::after { content: ""; width: 4px; height: 8px; border-right: 2px solid white; border-bottom: 2px solid white; transform: rotate(45deg) translate(-1px,-1px); }
  .consent label { font-size: 12px; line-height: 1.5; color: var(--vg-fg-2); cursor: pointer; }
  .consent label a { color: var(--vg-green-700); font-weight: 600; }

  .tabbar { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: rgba(255,255,255,0.94); backdrop-filter: blur(16px); border-top: 1px solid var(--vg-border); display: flex; align-items: flex-start; justify-content: space-around; padding: 8px 0 34px; z-index: 50; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; cursor: pointer; color: var(--vg-fg-4); padding: 4px 0; background: none; border: 0; }
  .tab.on { color: var(--vg-green-700); }
  .tab span { font-size: 10px; font-weight: 600; }

  .app-card { background: white; border: 1px solid var(--vg-border); border-radius: 14px; padding: 14px 16px; margin: 10px 20px; box-shadow: var(--vg-shadow-sm); }
  .app-card .row { display: flex; gap: 12px; align-items: center; }
  .app-card .logo { width: 38px; height: 38px; border-radius: 10px; background: var(--vg-green-50); color: var(--vg-green-700); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .app-card .t { font-weight: 700; font-size: 14px; }
  .app-card .c { font-size: 12px; color: var(--vg-fg-3); margin-top: 1px; }
  .app-card .stat { margin-top: 10px; display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .stat-info { background: var(--vg-info-bg); color: #1742A0; }
  .stat-eye { background: var(--vg-ink-100); color: var(--vg-fg-2); }
  .stat-success { background: var(--vg-success-bg); color: var(--vg-green-800); }
  .stat-danger { background: var(--vg-danger-bg); color: #9B2530; }

  .welcome { padding: 80px 28px 40px; height: 100%; display: flex; flex-direction: column; box-sizing: border-box; }
  .welcome .mark { width: 64px; height: 64px; border-radius: 16px; background: var(--vg-green-500); display: flex; align-items: center; justify-content: center; box-shadow: var(--vg-shadow-brand); margin-bottom: 24px; }
  .welcome h1 { font-family: var(--vg-font-display); font-size: 34px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 12px; }
  .welcome h1 em { font-style: normal; color: var(--vg-green-600); }
  .welcome p { font-size: 15px; line-height: 1.5; color: var(--vg-fg-2); margin: 0; }
  .welcome .btns { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
  .welcome .btns button { padding: 14px; border-radius: 14px; border: 0; font-weight: 700; font-size: 16px; }
  .welcome .btns .primary { background: var(--vg-green-500); color: white; }
  .welcome .btns .secondary { background: white; color: var(--vg-fg-1); border: 1px solid var(--vg-border-strong); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,

const PhIcon = ({ name, size = 22, color = 'currentColor', filled = false }) => {
  const s = { width: size, height: size, stroke: color, fill: filled ? color : 'none', strokeWidth: 1.75, strokeLinecap: 'round', strokeLinejoin: 'round' };
  const m = {
    search: <svg viewBox="0 0 24 24" {...s}><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>,
    heart: <svg viewBox="0 0 24 24" {...s}><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>,
    file: <svg viewBox="0 0 24 24" {...s}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>,
    user: <svg viewBox="0 0 24 24" {...s}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
    chev: <svg viewBox="0 0 24 24" {...s}><polyline points="15 18 9 12 15 6"/></svg>,
    chevR: <svg viewBox="0 0 24 24" {...s}><polyline points="9 18 15 12 9 6"/></svg>,
    pin: <svg viewBox="0 0 24 24" {...s}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>,
    clock: <svg viewBox="0 0 24 24" {...s}><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>,
    check: <svg viewBox="0 0 24 24" {...s}><polyline points="20 6 9 17 4 12"/></svg>,
    eye: <svg viewBox="0 0 24 24" {...s}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
    x: <svg viewBox="0 0 24 24" {...s}><path d="M18 6L6 18M6 6l12 12"/></svg>,
    leaf: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" style={{width:size,height:size}}><path d="M6 6 L12 18 L18 6"/><path d="M12 18 L12 22"/></svg>,
  };
  return m[name] || null;
};

const PhoneApp = () => {
  const [screen, setScreen] = React.useState('welcome');
  const [openJob, setOpenJob] = React.useState(null);
  const [tab, setTab] = React.useState('feed');
  const [saved, setSaved] = React.useState({ j2: true });
  const [apps, setApps] = React.useState(APPS_INIT);

  const toggleSave = (id) => setSaved(s => ({ ...s, [id]: !s[id] }));
  const goToDetail = (j) => { setOpenJob(j); setScreen('detail'); };
  const submit = () => {
    const j = openJob;
    setApps(a => [{ logo: j.logo, title: j.title, company: j.company, date: 'enviada agora', cls: 'stat-info', icon: 'clock', label: 'Em análise' }, ...a]);
    setScreen('success');
  };

  let inner = null;
  if (screen === 'welcome') inner = <Welcome onContinue={() => setScreen('app')} />;
  else if (screen === 'detail') inner = <Detail job={openJob} onBack={() => setScreen('app')} onApply={() => setScreen('apply')} />;
  else if (screen === 'apply') inner = <ApplyForm job={openJob} onBack={() => setScreen('detail')} onSubmit={submit} />;
  else if (screen === 'success') inner = <Success job={openJob} onDone={() => { setTab('apps'); setScreen('app'); }} />;
  else {
    if (tab === 'feed') inner = <Feed jobs={JOBS} onOpen={goToDetail} saved={saved} onSave={toggleSave} />;
    else if (tab === 'apps') inner = <Applications apps={apps} />;
    else if (tab === 'saved') inner = <Saved jobs={JOBS} saved={saved} onOpen={goToDetail} onSave={toggleSave} />;
    else if (tab === 'profile') inner = <Profile />;
  }

  return (
    <div style={{position:'relative', height: '100%'}}>
      {inner}
      {screen === 'app' && <BottomTabBar active={tab} onTab={setTab} />}
    </div>
  );
};

const App = () => (
  <div className="stage">
    <div className="device-wrap">
      <IOSDevice width={390} height={844}>
        <PhoneApp />
      </IOSDevice>
      <div className="device-label">Vagas Guarujá · Candidato</div>
    </div>
  </div>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
